    <style>
      html {
        font-size: 1vw;
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family: Inter, sans-serif;
      }

      .container {
        position: fixed;
        width: 100%;
        height: 100%;
      }

      #GlamAR-module {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 0;
      }

      #error {
        position: absolute;
        top: 20px;
        left: 20px;
        font-weight: bold;
        font-size: 16px;
      }

      .scan-save-status {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        box-sizing: border-box;
        width: max-content;
        max-width: calc(100% - 32px);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid #dededb;
        border-radius: 12px;
        background: white;
        color: #171717;
        box-shadow: 0 4px 20px #00000015;
        font-size: 14px;
        line-height: 1.4;
        z-index: 5001;
      }
      .scan-save-status[hidden] {
        display: none;
      }
      .scan-save-status button {
        flex-shrink: 0;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: #171717;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      .centeredLoader {
        position: fixed;
        display: flex;
        width: 100%;
        height: 100%;
        background: var(--layout-background-color);
        justify-content: center;
        align-items: center;
        z-index: 5000;
        background: white;
      }
      .lottieContainer {
        display: flex;
        padding: 7.5rem;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.25rem;
        flex-shrink: 0;
      }
      .waveGrid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 20rem;
        height: 20rem;
        flex-shrink: 0;
        aspect-ratio: 1 / 1;
      }
      .waveGrid .cell {
        width: 100%;
        height: 100%;
        background: #000;
        transform: scale(0.4);
        transform-origin: center;
        will-change: transform;
        animation: waveScale 1.57s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        box-shadow: 0 0 0 0.5px #000;
      }
      @keyframes waveScale {
        0% {
          transform: scale(0.4);
        }
        21% {
          transform: scale(1);
        }
        53% {
          transform: scale(1);
        }
        75% {
          transform: scale(0.4);
        }
        100% {
          transform: scale(0.4);
        }
      }
      .waveGrid .cell:nth-child(1) {
        animation-delay: 200ms;
      }
      .waveGrid .cell:nth-child(2) {
        animation-delay: 267ms;
      }
      .waveGrid .cell:nth-child(3) {
        animation-delay: 334ms;
      }
      .waveGrid .cell:nth-child(4) {
        animation-delay: 400ms;
      }
      .waveGrid .cell:nth-child(5) {
        animation-delay: 133ms;
      }
      .waveGrid .cell:nth-child(6) {
        animation-delay: 200ms;
      }
      .waveGrid .cell:nth-child(7) {
        animation-delay: 267ms;
      }
      .waveGrid .cell:nth-child(8) {
        animation-delay: 334ms;
      }
      .waveGrid .cell:nth-child(9) {
        animation-delay: 67ms;
      }
      .waveGrid .cell:nth-child(10) {
        animation-delay: 133ms;
      }
      .waveGrid .cell:nth-child(11) {
        animation-delay: 200ms;
      }
      .waveGrid .cell:nth-child(12) {
        animation-delay: 267ms;
      }
      .waveGrid .cell:nth-child(13) {
        animation-delay: 0ms;
      }
      .waveGrid .cell:nth-child(14) {
        animation-delay: 67ms;
      }
      .waveGrid .cell:nth-child(15) {
        animation-delay: 133ms;
      }
      .waveGrid .cell:nth-child(16) {
        animation-delay: 200ms;
      }
      .lottieText {
        margin: 0px;
        text-align: center;
        font-size: 3.75rem;
        font-style: normal;
        font-weight: 400;
      }

      @media (min-width: 648px) {
        .lottieContainer {
          padding: 3.7rem;
          gap: 0.62rem;
        }
        .waveGrid {
          width: 12.35rem;
          height: 12.35rem;
        }
        .lottieText {
          font-size: 2.16rem;
        }
      }

      /* Tablet Landscape */
      @media (min-width: 720px) and (orientation: landscape) {
        .lottieContainer {
          padding: 3.33rem;
          gap: 0.56rem;
        }
        .waveGrid {
          width: 11.11rem;
          height: 11.11rem;
        }
        .lottieText {
          font-size: 1.94rem;
        }
      }

      /* Web portrait */
      @media (min-width: 846px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.84rem;
          gap: 0.47rem;
        }
        .waveGrid {
          width: 14.18rem;
          height: 14.18rem;
        }
        .lottieText {
          font-size: 2.36rem;
        }
      }

      /* web Landscape */
      @media (min-width: 1440px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.67rem;
          gap: 0.28rem;
        }
        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }
        .lottieContainer h4 {
          font-size: 1.39rem;
        }
      }

      /* TV portrait */
      @media (min-width: 1080px) and (orientation: portrait) {
        .lottieContainer {
          padding: 2.22rem;
          gap: 0.37rem;
        }
        .waveGrid {
          width: 14.81rem;
          height: 14.81rem;
        }
        .lottieContainer h4 {
          font-size: 2.22rem;
        }
      }

      /* TV Landscape */
      @media (min-width: 1920px) and (orientation: landscape) {
        .lottieContainer {
          padding: 1.25rem;
          gap: 0.21rem;
        }
        .waveGrid {
          width: 8.33rem;
          height: 8.33rem;
        }
        .lottieContainer h4 {
          font-size: 1.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .waveGrid .cell {
          animation: none;
          transform: scale(1);
        }
      }
      [hidden] {
        display: none !important;
      }
      .login-screen {
        position: fixed;
        inset: 0;
        z-index: 6000;
        overflow-y: auto;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px;
        background: radial-gradient(ellipse at top, #fff 0, #f5f5f2 75%);
        color: #161616;
        font-size: 16px;
        line-height: 1.5;
      }
      .login-card {
        box-sizing: border-box;
        width: 100%;
        max-width: 440px;
        margin: auto;
        padding: 36px;
        background: #fff;
        border: 1px solid #e6e6e1;
        border-radius: 24px;
        box-shadow: 0 18px 70px #15151508;
      }
      .login-brand {
        --icon-color: #161616;
        display: block;
        width: 140px;
        max-width: 100%;
        height: auto;
      }
      .login-card h1 {
        margin: 32px 0 12px;
        font-size: clamp(28px, 5vw, 34px);
        line-height: 1.18;
        letter-spacing: -1px;
        font-weight: 600;
      }
      .login-description {
        margin: 0 0 28px;
        color: #676762;
        font-size: 15px;
      }
      .login-fields {
        min-width: 0;
        border: 0;
        padding: 0;
        margin: 0;
      }
      #emailField {
        margin-bottom: 20px;
      }
      .phone-controls {
        position: relative;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 10px;
      }
      .phone-controls > div {
        min-width: 0;
      }
      .country-button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        white-space: nowrap;
        cursor: pointer;
      }
      .country-button::after {
        content: "";
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
      }
      .country-button[aria-expanded="true"]::after {
        transform: translateY(2px) rotate(225deg);
      }
      .country-popover {
        position: absolute;
        z-index: 10;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        overflow: hidden;
        padding: 8px;
        border: 1px solid #d5d5d0;
        border-radius: 12px;
        background: white;
        box-shadow: 0 8px 30px #15151526;
      }
      .country-popover[data-placement="above"] {
        top: auto;
        bottom: calc(100% + 8px);
      }
      .country-search {
        flex-shrink: 0;
        margin-bottom: 8px;
      }
      .country-search:focus {
        outline-offset: -2px;
      }
      .country-list {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .country-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        box-sizing: border-box;
        padding: 10px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.3;
        cursor: pointer;
      }
      .country-option:hover,
      .country-option[data-active="true"] {
        background: #f0f0ed;
      }
      .country-option[aria-selected="true"] {
        font-weight: 600;
      }
      .country-option[aria-selected="true"] .country-option-name::after {
        content: " ✓";
      }
      .country-option-code {
        flex-shrink: 0;
        color: #676762;
      }
      .country-results {
        margin: 8px;
        color: #676762;
        font-size: 13px;
      }
      .contact-label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .contact-input {
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        padding: 13px 14px;
        border: 1px solid #d5d5d0;
        border-radius: 10px;
        background: #fff;
        color: #161616;
        font: inherit;
        font-size: 16px;
      }
      .contact-input::placeholder {
        color: #95958f;
      }
      .contact-input:focus {
        outline: 2px solid #161616;
        outline-offset: 2px;
        border-color: transparent;
      }
      .contact-input[aria-invalid="true"] {
        border-color: #b52727;
      }
      .contact-hint {
        margin: 8px 0 0;
        color: #73736e;
        font-size: 12px;
      }
      .contact-error {
        margin: 8px 0 0;
        color: #b52727;
        font-size: 13px;
      }
      .login-message {
        margin: 18px 0 0;
        padding: 12px;
        border-radius: 8px;
        background: #fff1f0;
        color: #9e2525;
        font-size: 13px;
      }
      .continue-button {
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        margin-top: 24px;
        padding: 14px 20px;
        border: 0;
        border-radius: 11px;
        background: #161616;
        color: white;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
      }
      .continue-button:hover {
        background: #30302c;
      }
      .continue-button:focus-visible {
        outline: 2px solid #161616;
        outline-offset: 3px;
      }
      .continue-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #loginForm[aria-busy="true"] .continue-button {
        cursor: wait;
      }
      .login-note {
        margin: 18px 0 0;
        text-align: center;
        color: #7a7a74;
        font-size: 12px;
      }
      @media (max-width: 480px) {
        .login-screen {
          padding: 20px 16px;
        }
        .login-card {
          padding: 28px 24px;
          border-radius: 20px;
        }
      }
    </style>
    <script defer src="./vendor/libphonenumber/libphonenumber-max.js"></script>
  </head>

        <h1 id="loginTitle">Your skin analysis<br />starts here.</h1>
        <p class="login-description">
          Enter your email address and phone number to get started.
        </p>
        <form id="loginForm" novalidate>
          <fieldset
            class="login-fields"
            id="loginFields"
            aria-label="Contact details"
          >
            <div id="emailField">
              <label class="contact-label" for="emailInput"
                >Email address</label
              >
              <input
                class="contact-input"
                id="emailInput"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="you@example.com"
                required
                aria-describedby="emailError"
              />
              <p class="contact-error" id="emailError" role="alert" hidden></p>
            </div>
            <div id="phoneField">
              <div class="phone-controls">
                <div class="country-picker" id="countryPicker">
                  <label class="contact-label" for="phoneCountry"
                    >Country code</label
                  >
                  <button
                    class="contact-input country-button"
                    id="phoneCountry"
                    type="button"
                    aria-describedby="phoneHint"
                  >
                    GB +44
                  </button>
                  <div class="country-popover" id="countryPopover" hidden>
                    <input
                      class="contact-input country-search"
                      id="countrySearch"
                      type="search"
                      autocomplete="off"
                      autocapitalize="none"
                      spellcheck="false"
                      aria-label="Search country or calling code"
                      placeholder="Search country or code"
                    />
                    <div class="country-list" id="countryList"></div>
                    <p class="country-results" id="countryResults" hidden></p>
                  </div>
                </div>
                <div>
                  <label class="contact-label" for="phoneInput"
                    >Phone number</label
                  >
                  <input
                    class="contact-input"
                    id="phoneInput"
                    name="phone"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel-national"
                    placeholder="07400 123456"
                    required
                    aria-describedby="phoneHint phoneError"
                  />
                </div>
              </div>
              <p class="contact-hint" id="phoneHint">
                Select your country code and enter your phone number.
              </p>
              <p class="contact-error" id="phoneError" role="alert" hidden></p>
            </div>
          </fieldset>
          <p class="login-message" id="loginMessage" role="alert" hidden></p>
          <button
            class="continue-button"
            id="continueButton"
            type="submit"
            disabled
          >
            Continue <span aria-hidden="true">→</span>
          </button>
          <p class="login-note">No password or OTP needed.</p>
        </form>
      </section>
    </main>

    <div class="container" id="experienceContainer" hidden>
      <div id="GlamAR-module"></div>
      <div id="error"><span class="error-text"></span></div>
    </div>
    <div class="scan-save-status" id="scanSaveStatus" hidden>
      <span id="scanSaveMessage" role="status" aria-live="polite"></span>
      <button id="retryScanSave" type="button" hidden>Retry save</button>
    </div>
    <div
      class="centeredLoader"
      id="lottieLoader"
      hidden
      role="status"
      aria-live="polite"
    >
      <div class="lottieContainer">
        <div class="waveGrid" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span
          ><span class="cell"></span><span class="cell"></span>
        </div>
        <h4 class="lottieText">Loading your experience</h4>
      </div>
    </div>
    <script type="module">
      import { createContactForm } from "./src/contact-form.mjs";
      import { createLoginRecordStore } from "./src/login-records.mjs";
      import { createScanHistoryWriter } from "./src/scan-history.mjs";

      const lottieLoader = document.getElementById("lottieLoader");
      const loginScreen = document.getElementById("loginScreen");
      const loginForm = document.getElementById("loginForm");
      const loginFields = document.getElementById("loginFields");
      const loginMessage = document.getElementById("loginMessage");
      const continueButton = document.getElementById("continueButton");
      const experienceContainer = document.getElementById(
        "experienceContainer",
      );
      const inputs = {
        email: document.getElementById("emailInput"),
        phone: document.getElementById("phoneInput"),
      };
      let starting = false;
      let initialized = false;
      let needsReload = false;
      let sdkPromise;
      let startupTimer;
      let scanWriter;
      let scanStatusTimer;
      const scanSaveStatus = document.getElementById("scanSaveStatus");
      const scanSaveMessage = document.getElementById("scanSaveMessage");
      const retryScanSave = document.getElementById("retryScanSave");

      const apiKey = "a9b90ac7-218e-4ee9-b0ba-acb6487f803b";
      const appId = "7fb254ab-10bf-4a42-aedd-661e64a0e4ca";

      const loginRecordStore = createLoginRecordStore({
        recordsUrl:
          "https://api.pixelbin.io/service/public/misc/v1.0/boltic-database/tables/768e99df-f9c4-4501-8725-19be6365337c/records",
        appId,
        userIdMethod: "phone",
      });
      const loaderText = document.querySelector(".lottieText");

      function showScanSaveStatus({ state, pending }) {
        clearTimeout(scanStatusTimer);
        scanSaveStatus.hidden = false;
        retryScanSave.hidden =
          state !== "error" && !(state === "invalid" && pending > 0);
        scanSaveMessage.textContent = {
          saving: "Saving your scan…",
          saved: "Scan saved.",
          error: "Your scan could not be saved. Keep this page open and retry.",
          invalid: "The scan details are incomplete and could not be saved.",
        }[state];
        if (state === "saved") {
          scanStatusTimer = setTimeout(() => {
            scanSaveStatus.hidden = true;
          }, 3000);
        }
      }
      retryScanSave.addEventListener("click", () => {
        void scanWriter?.retry();
      });
      window.addEventListener("online", () => {
        void scanWriter?.retry();
      });
      window.addEventListener("beforeunload", (event) => {
        if (scanWriter?.pendingCount) {
          event.preventDefault();
          event.returnValue = "";
        }
      });

      const contactForm = createContactForm({
        emailInput: inputs.email,
        phoneInput: inputs.phone,
        emailError: document.getElementById("emailError"),
        phoneError: document.getElementById("phoneError"),
        phoneHint: document.getElementById("phoneHint"),
        countryRoot: document.getElementById("countryPicker"),
        countryButton: document.getElementById("phoneCountry"),
        countrySearch: document.getElementById("countrySearch"),
        countryList: document.getElementById("countryList"),
        countryStatus: document.getElementById("countryResults"),
        onEdit() {
          loginMessage.hidden = true;
        },
        onValidityChange(valid) {
          if (!needsReload)
            continueButton.disabled = !valid || starting || initialized;
        },
      });

      function loadSDK() {
        if (window.GlamAR?.init) return Promise.resolve(window.GlamAR);
        if (sdkPromise) return sdkPromise;
        sdkPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          let done = false;
          const finish = (error) => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            script.onload = script.onerror = null;
            if (error) {
              script.remove();
              reject(error);
            } else resolve(window.GlamAR);
          };
          const timer = setTimeout(
            () => finish(new Error("SDK loading timed out")),
            20000,
          );
          script.src = "https://cdn.glamar.io/sdk/wrapper";
          script.onload = () =>
            finish(window.GlamAR?.init ? null : new Error("SDK unavailable"));
          script.onerror = () => finish(new Error("SDK unavailable"));
          document.head.append(script);
        }).catch((error) => {
          sdkPromise = null;
          throw error;
        });
        return sdkPromise;
      }

      function startFailed(wasInitialized, message) {
        clearTimeout(startupTimer);
        starting = false;
        needsReload = wasInitialized;
        lottieLoader.hidden = true;
        experienceContainer.hidden = true;
        loginScreen.hidden = false;
        loginFields.disabled = wasInitialized;
        if (wasInitialized) continueButton.disabled = false;
        else contactForm.refresh();
        continueButton.textContent = wasInitialized
          ? "Reload page"
          : "Try again";
        loginForm.removeAttribute("aria-busy");
        loginMessage.textContent =
          message ||
          (wasInitialized
            ? "The experience could not start. Reload the page and try again."
            : "The experience could not load. Check your connection and try again.");
        loginMessage.hidden = false;
        continueButton.focus();
      }

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (needsReload) {
          window.location.reload();
          return;
        }
        if (starting || initialized) return;
        loginMessage.hidden = true;
        const contacts = contactForm.validate();
        if (!contacts) return;
        contactForm.closeCountryPicker();
        if (!apiKey) {
          loginMessage.textContent =
            "The experience is not configured. Please contact the team.";
          loginMessage.hidden = false;
          return;
        }

        starting = true;
        loginFields.disabled = true;
        continueButton.disabled = true;
        loginForm.setAttribute("aria-busy", "true");
        loginScreen.hidden = true;
        experienceContainer.hidden = false;
        lottieLoader.hidden = false;
        loaderText.textContent = "Saving your details";
        let initAttempted = false;
        let recordSaved = false;
        try {
          const loginRecord = await loginRecordStore.resolveContacts(contacts);
          // Scope the SDK identity to this app; keep stored contact details unchanged.
          const userId = `${appId}:${loginRecord.userId}`;
          recordSaved = true;
          loaderText.textContent = "Loading your experience";
          const sdk = await loadSDK();
          const config = {
            platform: "web",
            mode: "private",
            category: "skinanalysis",
            configuration: { skinAnalysis: { appId, userId } },
            meta: {
              sdkVersion: "2.0.0",
            },
          };
          const writer = createScanHistoryWriter({
            store: loginRecordStore,
            recordId: loginRecord.recordId,
            appId,
            onStatus: showScanSaveStatus,
          });
          scanWriter = writer;
          const showExperience = () => {
            if (needsReload) return;
            clearTimeout(startupTimer);
            lottieLoader.hidden = true;
            lottieLoader.style.display = "none";
          };
          startupTimer = setTimeout(() => {
            // A missed callback must not hide an SDK that has already loaded.
            if (sdk.isLoaded?.()) showExperience();
            else startFailed(true);
          }, 45000);
          initAttempted = true;
          // init() replaces the wrapper's event emitter. Subscribe immediately
          // after it returns, before awaiting anything or iframe events arrive.
          const initialization = sdk.init("GlamAR-module", apiKey, config);
          sdk.addEventListener("loading", showExperience);
          sdk.addEventListener("loaded", showExperience);
          sdk.addEventListener("skin-analysis", (event) => {
            void writer.handleEvent(event);
          });
          if (sdk.isLoaded?.()) showExperience();
          await initialization;
          if (!needsReload) {
            initialized = true;
            starting = false;
          }
        } catch (error) {
          const message = recordSaved
            ? undefined
            : error.code === "contact_conflict"
              ? "These details do not match the same record. Check your email and phone number, or contact the team."
              : error.code === "duplicate_identity"
                ? "More than one record matches these details. Please contact the team to link your account."
                : "We could not save or link your details. Check your connection and try again.";
          startFailed(initAttempted, message);
        }
      });
    </script>
  </body>
</html>
